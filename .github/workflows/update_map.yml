name: update-map

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC
  workflow_dispatch:

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,shinylive]"

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: groq:qwen/qwen3.8-27b
        run: python -m src.main

      - name: Run offline tests
        run: pytest

      - name: Build Shinylive export
        run: |
          cp data/meetings_latest.csv data/last_run.txt data/section_groups.csv shinylive_app/data/
          cp meeting_time.py shinylive_app/meeting_time.py
          python -c "from shinylive._export import export; export('shinylive_app', 'site/shinylive')"

      # The R app is a reference port: build it best-effort so it can never
      # block the weekly data refresh or the Python deploy.
      - uses: r-lib/actions/setup-r@v2
        continue-on-error: true

      - name: Install R packages (Posit binaries, source fallback)
        continue-on-error: true
        run: |
          Rscript -e 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os))); install.packages(c("shiny", "bslib", "leaflet", "shinylive"), repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest", type = "binary")' \
            || (sudo apt-get update -y \
                && sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev \
                && Rscript -e 'install.packages(c("shiny", "bslib", "leaflet", "shinylive"), repos = "https://cloud.r-project.org")')

      - name: Run R selftest
        continue-on-error: true
        run: Rscript shinylive_r_app/selftest.R

      - name: Build Shinylive (R) export
        continue-on-error: true
        run: |
          cp data/meetings_latest.csv data/last_run.txt data/section_groups.csv shinylive_r_app/data/
          rm -rf site/shinylive-r
          Rscript -e 'shinylive::export("shinylive_r_app", "site/shinylive-r", template_params = list(title = "MAA Sectional Meetings"))'

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh meeting data [skip ci]"
            git push
          fi

      # Deploy in this same job: site/index.html and site/shinylive/ are
      # generated here and never committed, so a fresh-checkout job would
      # only find an empty site/.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
